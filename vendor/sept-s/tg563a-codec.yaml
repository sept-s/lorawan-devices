# Uplink decoder decodes binary data uplink into a JSON object
uplinkDecoder:
  fileName: tg563a-codec.js
  # Examples
  examples:
    - description: Basic message
      input:
        fPort: 1
        bytes:  [0, 120,26, 3, 0]
      output:
        data:
          messageType: "Periodic uplink message"
          configuration:
            rawValue: "78"
            transmissionPeriod: 1
            additionalDataEnabled: 1
            obstructionEventEnabled: 1
            hardwareFailureEventEnabled: 1
            smokeEventEnabled: 1
          temperature: 26
          status:
            mounted: 1
            brightness: 1
            temperatureOutOfRange: 0
            obstacleDetected: 0
            airInletCovered: 0
            tooLongInactivity: 0
            tooLongUnmounted: 0
            smokeAlarm: 0
            batteryLow: 0
            smokeChamberFailure: 0
            fouledSmokeChamber: 0
            ultrasonicSensorFailure: 0
            infraredSensorFailure: 0
            buzzerFailure: 0
      # Normalized output, uses the normalizeUplink function
      normalizedOutput:
        data:
          - air:
              temperature: 26
    - description: Message with additional data
      input:
        fPort: 1
        bytes: [15,126,26,3,0,205,37,145,86,52,198,50,227,50,94,5,227,66,248,3,9,26,254,19,255,255,25,200,73,39,0,0,226,26,5]
      output:
        data:
          messageType: "Message with additional data"
          configuration:
            rawValue: "7E"
            transmissionPeriod: 24
            additionalDataEnabled: 1
            obstructionEventEnabled: 1
            hardwareFailureEventEnabled: 1
            smokeEventEnabled: 1
          temperature: 26,
          status:
            mounted: 1
            brightness: 1
            temperatureOutOfRange: 0
            obstacleDetected: 0
            airInletCovered: 0
            tooLongInactivity: 0
            tooLongUnmounted: 0
            smokeAlarm: 0
            batteryLow: 0
            smokeChamberFailure: 0
            fouledSmokeChamber: 0
            ultrasonicSensorFailure: 0
            infraredSensorFailure: 0
            buzzerFailure: 0
          batteryLevel: 3.05
          serialNumber: "34569125"
          productionDate: "06/06/2025"
          installationDate: "03/07/2025"
          runningTimeCounter: 1234800
          smokeAlarmTimeCounter: 369792000
          testAlarmTimeCounter: 254
          faultTimeCounter: 99960
          smokeAlarmCounter: 254
          testAlarmCounter: 19
          smokeErrorCounter: 255
          lowBatteryCounter: 255
          smokeAlarmDeactivationCounter: 25
          faultDeactivationCounter: 200
          mountingCounter: 73
          energyUsage: 39
          lightGuideDirtiness: 0
          foulingSmokeChamber: 0
          minimumTemperature: -30
          maximumTemperature: 26
          distanceThreshold: 50
      # Normalized output, uses the normalizeUplink function
      normalizedOutput:
        data:
          - battery: 3.05
          - air:
              temperature: 26
# Downlink encoder encodes JSON object into a binary data downlink
downlinkEncoder:
  fileName: tg563a-codec.js
  # Examples
  examples:
    - description: Set TX period to 5
      input:
        data:
          command: SET_TX_PERIOD
          parameter: 5
      output:
        bytes: [5]
        fPort: 1
# Downlink decoder decodes the encoded downlink message
downlinkDecoder:
  fileName: tg563a-codec.js
  # Examples
  examples:
    - description: Set TX period to 5
      input:
        fPort: 1
        bytes: [5]
      output:
        data:
          command: SET_TX_PERIOD
          parameter: 5
